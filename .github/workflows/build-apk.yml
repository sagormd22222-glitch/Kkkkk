name: Build Android APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova / Capacitor & Build APK
        run: |
          npm install -g cordova
          cordova create myApp com.example.myapp MyApp
          cd myApp
          cordova platform add android
          
          # ওয়েবসাইট থেকে আসা কাস্টম কোড বা জিপ ফাইল এখানে এক্সট্র্যাক্ট করে www ফোল্ডারে বসানো যায়
          # উদাহরণ হিসেবে ডিফল্ট বিল্ড কমান্ড:
          cordova build android --release --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: myApp/platforms/android/app/build/outputs/apk/release/*.apk
